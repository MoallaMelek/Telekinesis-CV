name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q main.py hand_tracker.py manipulation.py segmentation.py selection.py scene.py hud.py model_assets.py lighting.py tools
      - run: python -m unittest test_core test_selection test_reliability

  real-model:
    name: Real EdgeSAM interactions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models/edgesam
          key: edgesam-${{ hashFiles('segmentation.py', 'model_assets.py') }}
      - run: python tools/prepare_models.py --segmentation-only
      - run: python -m unittest test_pipeline
      - run: python tools/fixture_demo.py .cache/fixture-demo.jpg
